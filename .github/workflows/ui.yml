name: Verify local node editor
'on':
  push:
    paths: ['ui/**', 'src/weavem/**', 'tests/test_editor*.py', 'examples/editor-local/**', 'scripts/verify-editor.mjs', 'pyproject.toml', 'DESIGN.md', '.github/workflows/ui.yml']
  pull_request:
    paths: ['ui/**', 'src/weavem/**', 'tests/test_editor*.py', 'examples/editor-local/**', 'scripts/verify-editor.mjs', 'pyproject.toml', 'DESIGN.md', '.github/workflows/ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.artifacts/node-editor/browsers
      WEAVEM_ARTIFACTS_DIR: ${{ github.workspace }}/.artifacts/node-editor/ci
      WEAVEM_EDITOR_EVIDENCE: ${{ github.workspace }}/.artifacts/node-editor/live
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the locked frontend tools
        run: npm ci
      - name: Check types and conventions
        run: npm run typecheck && npm run lint
      - name: Test the independent draft model
        run: npm test
      - name: Build the frontend
        run: npm run build
      - name: Install the browser on the disposable CI runner
        run: npx playwright install --with-deps chromium
      - name: Verify the workbench in Chromium
        run: npm run test:e2e
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install the framework from this checkout
        working-directory: .
        run: python -m pip install -e .
      - name: Verify execution and bridge boundaries
        working-directory: .
        run: python -m unittest discover -s tests -p 'test_editor*.py' -v
      - name: Run a real native canvas flow in Chromium
        working-directory: .
        run: node scripts/verify-editor.mjs
      - name: Preserve browser-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-editor-browser-evidence
          path: |
            .artifacts/node-editor/playwright-results
            .artifacts/node-editor/playwright-report
            .artifacts/node-editor/live
          if-no-files-found: warn
          retention-days: 7
