name: Verify Weavem
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WEAVEM_ARTIFACTS_DIR: ${{ github.workspace }}/.artifacts/ci-build
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the single candidate shared by every verification lane
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Record and validate the candidate
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then args=(--tag "$GITHUB_REF_NAME"); fi
          python scripts/release-alpha.py prepare --dist dist "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: weavem-wheel
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  supported-python:
    needs: build-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    env:
      WEAVEM_ARTIFACTS_DIR: ${{ github.workspace }}/.artifacts/ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: weavem-wheel
          path: dist
      - name: Verify the shared candidate
        run: |
          mkdir -p "$RUNNER_TEMP/weavem-ci-${{ matrix.python }}"
          python scripts/release-alpha.py check --dist dist
      - name: Install the wheel and test tooling
        run: |
          set -o pipefail
          python -m pip install wheel==0.48.0 2>&1 | tee "$RUNNER_TEMP/weavem-ci-${{ matrix.python }}/install-tooling.log"
          python -m pip install dist/weavem-*.whl 2>&1 | tee "$RUNNER_TEMP/weavem-ci-${{ matrix.python }}/install-wheel.log"
          python -m pip freeze 2>&1 | tee "$RUNNER_TEMP/weavem-ci-${{ matrix.python }}/installed-freeze.txt"
          python -m pip check 2>&1 | tee "$RUNNER_TEMP/weavem-ci-${{ matrix.python }}/pip-check.log"
      - name: Verify native authoring environment
        run: |
          set -o pipefail
          weavem doctor 2>&1 | tee "$RUNNER_TEMP/weavem-ci-${{ matrix.python }}/doctor.log"
      - name: Run the full test suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/weavem-ci-${{ matrix.python }}/tests.log"
      - name: Install and verify the wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/weavem-wheel-${{ matrix.python }}"
          set -o pipefail
          "$RUNNER_TEMP/weavem-wheel-${{ matrix.python }}/bin/python" -m pip install dist/weavem-*.whl 2>&1 | tee "$RUNNER_TEMP/weavem-ci-${{ matrix.python }}/fresh-install.log"
          "$RUNNER_TEMP/weavem-wheel-${{ matrix.python }}/bin/python" -m pip freeze 2>&1 | tee "$RUNNER_TEMP/weavem-ci-${{ matrix.python }}/fresh-freeze.txt"
          "$RUNNER_TEMP/weavem-wheel-${{ matrix.python }}/bin/python" -m pip check 2>&1 | tee "$RUNNER_TEMP/weavem-ci-${{ matrix.python }}/fresh-pip-check.log"
          cp scripts/verify-installed-wheel.py "$RUNNER_TEMP/verify-installed-wheel.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/weavem-wheel-${{ matrix.python }}/bin/python" -I verify-installed-wheel.py --work-dir "$RUNNER_TEMP/weavem-installed-wheel-${{ matrix.python }}"
      - name: Execute the official user documentation against the installed wheel
        run: |
          bundle="$RUNNER_TEMP/weavem-user-docs-${{ matrix.python }}"
          docs="$bundle/docs"
          evidence="$RUNNER_TEMP/weavem-user-docs-evidence-${{ matrix.python }}"
          mkdir "$bundle"
          cp -a docs "$docs"
          cp README.md LICENSE NOTICE TRADEMARKS.md pyproject.toml "$bundle"
          mkdir "$bundle/tests"
          cp tests/test_packaging.py "$bundle/tests"
          mkdir -p "$bundle/examples"
          cp -a examples/local-cross-project "$bundle/examples/local-cross-project"
          cp scripts/verify-user-docs.py "$RUNNER_TEMP/verify-user-docs.py"
          "$RUNNER_TEMP/weavem-wheel-${{ matrix.python }}/bin/python" -I "$RUNNER_TEMP/verify-user-docs.py" \
            --docs "$docs" \
            --wheel "$GITHUB_WORKSPACE"/dist/weavem-*.whl \
            --work-dir "$evidence"
      - name: Prepare native handoff for a separate consumer runner
        run: |
          handoff="$RUNNER_TEMP/weavem-native-handoff-${{ matrix.python }}"
          producer="$RUNNER_TEMP/weavem-installed-wheel-${{ matrix.python }}"
          mkdir "$handoff"
          cp -a "$producer/consumer/task-store" "$handoff/store"
          cp "$producer/result.json" "$handoff/producer-result.json"
          cp scripts/verify-native-handoff.py "$handoff/verify-native-handoff.py"
          test ! -e "$handoff/author"
          test ! -e "$handoff/tasks"
          test -f "$handoff/store/release.money/2.0.0"/*/manifest.json
          test -f "$handoff/store/_flows/release.money_flow/2.0.0"/*/manifest.json
      - name: Upload native handoff
        uses: actions/upload-artifact@v7
        with:
          name: native-handoff-${{ matrix.python }}
          include-hidden-files: true
          path: ${{ runner.temp }}/weavem-native-handoff-${{ matrix.python }}
          if-no-files-found: error
      - name: Upload installed-wheel evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-wheel-${{ matrix.python }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/weavem-ci-${{ matrix.python }}
            ${{ runner.temp }}/weavem-installed-wheel-${{ matrix.python }}
            ${{ runner.temp }}/weavem-user-docs-evidence-${{ matrix.python }}/result.json
            ${{ runner.temp }}/weavem-user-docs-evidence-${{ matrix.python }}/tutorial.sh
            ${{ runner.temp }}/weavem-user-docs-evidence-${{ matrix.python }}/tutorial.stdout
            ${{ runner.temp }}/weavem-user-docs-evidence-${{ matrix.python }}/tutorial.stderr
            ${{ runner.temp }}/weavem-user-docs-evidence-${{ matrix.python }}/consumer-native.stdout
            ${{ runner.temp }}/weavem-user-docs-evidence-${{ matrix.python }}/consumer-native.stderr
            ${{ runner.temp }}/weavem-user-docs-evidence-${{ matrix.python }}/consumer-flow.stdout
            ${{ runner.temp }}/weavem-user-docs-evidence-${{ matrix.python }}/consumer-flow.stderr
            ${{ runner.temp }}/weavem-user-docs-evidence-${{ matrix.python }}/author-hidden/tasks
            ${{ runner.temp }}/weavem-user-docs-evidence-${{ matrix.python }}/author-hidden/flows
            ${{ runner.temp }}/weavem-user-docs-evidence-${{ matrix.python }}/consumer/task-store
          if-no-files-found: warn
  native-handoff:
    needs: [build-wheel, supported-python]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: weavem-wheel
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: native-handoff-${{ matrix.python }}
          path: ${{ runner.temp }}/native-handoff-download-${{ matrix.python }}
      - name: Install the exact tested wheel in an isolated consumer environment
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          python -m venv "$RUNNER_TEMP/weavem-native-consumer-${{ matrix.python }}"
          "$RUNNER_TEMP/weavem-native-consumer-${{ matrix.python }}/bin/python" -m pip install dist/weavem-*.whl
          "$RUNNER_TEMP/weavem-native-consumer-${{ matrix.python }}/bin/python" -m pip check
      - name: Consume the transferred native store without author source or rebuild
        run: |
          download="$RUNNER_TEMP/native-handoff-download-${{ matrix.python }}"
          mapfile -t gates < <(find "$download" -type f -name verify-native-handoff.py -print)
          test "${#gates[@]}" -eq 1
          handoff="$(dirname "${gates[0]}")"
          test ! -e "$handoff/author"
          test ! -e "$handoff/tasks"
          "$RUNNER_TEMP/weavem-native-consumer-${{ matrix.python }}/bin/python" -I "$handoff/verify-native-handoff.py" \
            --store "$handoff/store" \
            --expected "$handoff/producer-result.json" \
            --work-dir "$RUNNER_TEMP/weavem-native-handoff-evidence-${{ matrix.python }}"
      - name: Upload native handoff evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-handoff-evidence-${{ matrix.python }}
          include-hidden-files: true
          path: ${{ runner.temp }}/weavem-native-handoff-evidence-${{ matrix.python }}
          if-no-files-found: warn
  latest-python-release-gate:
    needs: build-wheel
    # Intentionally blocking: never waive a new stable interpreter with
    # --ignore-requires-python or continue-on-error to manufacture a release.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WEAVEM_ARTIFACTS_DIR: ${{ github.workspace }}/.artifacts/ci-latest
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
          allow-prereleases: false
      - uses: actions/download-artifact@v8
        with:
          name: weavem-wheel
          path: dist
      - name: Verify the shared candidate
        run: |
          mkdir -p "$RUNNER_TEMP/weavem-ci-latest"
          python scripts/release-alpha.py check --dist dist
      - name: Install the wheel and test tooling when supported
        run: |
          set -o pipefail
          python -m pip install wheel==0.48.0 2>&1 | tee "$RUNNER_TEMP/weavem-ci-latest/install-tooling.log"
          python -m pip install dist/weavem-*.whl 2>&1 | tee "$RUNNER_TEMP/weavem-ci-latest/install-wheel.log"
          python -m pip freeze 2>&1 | tee "$RUNNER_TEMP/weavem-ci-latest/installed-freeze.txt"
          python -m pip check 2>&1 | tee "$RUNNER_TEMP/weavem-ci-latest/pip-check.log"
      - name: Verify native authoring environment
        run: |
          set -o pipefail
          weavem doctor 2>&1 | tee "$RUNNER_TEMP/weavem-ci-latest/doctor.log"
      - name: Run the full test suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/weavem-ci-latest/tests.log"
      - name: Install and verify the wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/weavem-wheel-latest"
          set -o pipefail
          "$RUNNER_TEMP/weavem-wheel-latest/bin/python" -m pip install dist/weavem-*.whl 2>&1 | tee "$RUNNER_TEMP/weavem-ci-latest/fresh-install.log"
          "$RUNNER_TEMP/weavem-wheel-latest/bin/python" -m pip freeze 2>&1 | tee "$RUNNER_TEMP/weavem-ci-latest/fresh-freeze.txt"
          "$RUNNER_TEMP/weavem-wheel-latest/bin/python" -m pip check 2>&1 | tee "$RUNNER_TEMP/weavem-ci-latest/fresh-pip-check.log"
          cp scripts/verify-installed-wheel.py "$RUNNER_TEMP/verify-installed-wheel.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/weavem-wheel-latest/bin/python" -I verify-installed-wheel.py --work-dir "$RUNNER_TEMP/weavem-installed-wheel-latest"
      - name: Execute the official user documentation against the installed wheel
        run: |
          bundle="$RUNNER_TEMP/weavem-user-docs-latest"
          docs="$bundle/docs"
          evidence="$RUNNER_TEMP/weavem-user-docs-evidence-latest"
          mkdir "$bundle"
          cp -a docs "$docs"
          cp README.md LICENSE NOTICE TRADEMARKS.md pyproject.toml "$bundle"
          mkdir "$bundle/tests"
          cp tests/test_packaging.py "$bundle/tests"
          mkdir -p "$bundle/examples"
          cp -a examples/local-cross-project "$bundle/examples/local-cross-project"
          cp scripts/verify-user-docs.py "$RUNNER_TEMP/verify-user-docs.py"
          "$RUNNER_TEMP/weavem-wheel-latest/bin/python" -I "$RUNNER_TEMP/verify-user-docs.py" \
            --docs "$docs" \
            --wheel "$GITHUB_WORKSPACE"/dist/weavem-*.whl \
            --work-dir "$evidence"
      - name: Upload installed-wheel evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-wheel-latest
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/weavem-ci-latest
            ${{ runner.temp }}/weavem-installed-wheel-latest
            ${{ runner.temp }}/weavem-user-docs-evidence-latest/result.json
            ${{ runner.temp }}/weavem-user-docs-evidence-latest/tutorial.sh
            ${{ runner.temp }}/weavem-user-docs-evidence-latest/tutorial.stdout
            ${{ runner.temp }}/weavem-user-docs-evidence-latest/tutorial.stderr
            ${{ runner.temp }}/weavem-user-docs-evidence-latest/consumer-native.stdout
            ${{ runner.temp }}/weavem-user-docs-evidence-latest/consumer-native.stderr
            ${{ runner.temp }}/weavem-user-docs-evidence-latest/consumer-flow.stdout
            ${{ runner.temp }}/weavem-user-docs-evidence-latest/consumer-flow.stderr
            ${{ runner.temp }}/weavem-user-docs-evidence-latest/author-hidden/tasks
            ${{ runner.temp }}/weavem-user-docs-evidence-latest/author-hidden/flows
            ${{ runner.temp }}/weavem-user-docs-evidence-latest/consumer/task-store
          if-no-files-found: warn
  publish-alpha:
    # A manual run (even on a tag) and a pull request can never publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == true
    needs: [build-wheel, supported-python, native-handoff, latest-python-release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: alpha-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      WEAVEM_ARTIFACTS_DIR: ${{ github.workspace }}/.artifacts/ci-release
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: weavem-wheel
          path: dist
      - name: Verify, upload, and publish the tested candidate without rebuilding
        run: |
          git fetch origin main
          python scripts/release-alpha.py publish --dist dist --tag "$RELEASE_TAG"
