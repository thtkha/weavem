[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weavem"
version = "0.1.0a2"
description = "Local-first, versioned task artifacts for Prefect flows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "TRADEMARKS.md"]
requires-python = ">=3.12,<3.16"
# Native task authoring is a first-class workflow, not an optional add-on.
# Retain the verified FastAPI pin during the Prefect/Python support upgrade;
# relaxing it requires a separate fresh installed-wheel orchestration gate.
dependencies = ["prefect==3.9.0", "fastapi==0.143.0", "Cython==3.3.0", "setuptools==84.0.0", "ziglang==0.17.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Repository = "https://github.com/thtkha/weavem"

[project.optional-dependencies]
# Retained so existing ``pip install 'weavem[native]'`` commands continue to work.
# The native Python tooling now ships with every installation; a compiler and
# matching headers are supplied by the managed native builder.
native = []

[project.scripts]
weavem = "weavem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
weavem = ["_native_headers/*.tar.gz", "_native_headers/*.json", "_native_headers/*LICENSE*"]
